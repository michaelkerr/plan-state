id: garden-fall
version: "1.1.0"
name: Fall Garden
description: >
  Cool-season vegetable garden for zone 7a-8a.  Covers succession
  planting of brassicas, greens, and root vegetables from late summer
  through first hard freeze.

params:
  - name: zone
    type: string
    required: true
    description: "USDA hardiness zone (e.g. '7a') — used in item text, not eval"

  - name: frost_date_fall
    type: date
    required: true
    description: "Expected first frost date (YYYY-MM-DD)"
  - name: beds
    type: entity_ref
    required: true
    description: "List of bed entities from domain context"

items:
  - ref: seed-start-brassicas
    name: "Start brassica seeds indoors"
    description: "Start broccoli, cabbage, cauliflower in trays 6-8 weeks before transplant (USDA zone {zone})"
    group: "Brassicas"
    trigger:
      type: calendar
      date: "{frost_date_fall}"
      prep_days: 70
    sort_order: 1
    checklist:
      - label: "Fill seed trays with starting mix"
      - label: "Plant seeds 1/4 inch deep"
      - label: "Water and cover with humidity dome"
      - label: "Place under grow lights"

  - ref: transplant-brassicas
    name: "Transplant brassicas to {entity.name}"
    group: "Brassicas"
    per_entity: beds
    trigger:
      type: compound
      op: and
      triggers:
        - type: after
          item_ref: seed-start-brassicas
          event: completed
          offset_days: 14
        - type: condition
          rules:
            - metric: daily_high
              operator: "<="
              value: 85
              sustained_days: 3
    sort_order: 2
    checklist:
      - label: "Harden off seedlings for 5-7 days"
      - label: "Amend bed with compost"
      - label: "Transplant at 18-inch spacing"
      - label: "Water deeply and mulch"

  - ref: direct-sow-greens
    name: "Direct sow greens in {entity.name}"
    description: "Lettuce, spinach, kale, arugula, chard"
    group: "Greens"
    per_entity: beds
    trigger:
      type: compound
      op: and
      triggers:
        - type: calendar
          date: "{frost_date_fall}"
          prep_days: 70
        - type: condition
          rules:
            - metric: daily_high
              operator: "<="
              value: 85
              sustained_days: 3
    sort_order: 3
    checklist:
      - label: "Prepare bed surface (rake smooth)"
      - label: "Broadcast or row-sow seeds"
      - label: "Cover lightly with soil"
      - label: "Water gently"

  - ref: succession-sow-greens
    name: "Succession sow greens"
    group: "Greens"
    trigger:
      type: after
      item_ref: direct-sow-greens
      event: completed
      offset_days: 14
    sort_order: 4

  - ref: direct-sow-roots
    name: "Direct sow root vegetables in {entity.name}"
    description: "Carrots, radishes, turnips, beets"
    group: "Root Vegetables"
    per_entity: beds
    trigger:
      type: compound
      op: and
      triggers:
        - type: calendar
          date: "{frost_date_fall}"
          prep_days: 60
        - type: condition
          rules:
            - metric: daily_high
              operator: "<="
              value: 80
              sustained_days: 3
    sort_order: 5
    checklist:
      - label: "Loosen soil 8-10 inches deep"
      - label: "Remove rocks and debris"
      - label: "Sow seeds per packet spacing"
      - label: "Keep moist until germination"

  - ref: fall-fertilize
    name: "Fall fertilize beds"
    group: "Maintenance"
    trigger:
      type: after
      item_ref: transplant-brassicas
      event: completed
      offset_days: 21
    sort_order: 6
    checklist:
      - label: "Side-dress with balanced organic fertilizer"
      - label: "Water in thoroughly"

  - ref: frost-protect
    name: "Install frost protection"
    description: "Row cover or cold frames for extending the season"
    group: "Maintenance"
    trigger:
      type: compound
      op: and
      triggers:
        - type: calendar
          date: "{frost_date_fall}"
          prep_days: 7
        - type: condition
          rules:
            - metric: daily_low
              operator: "<="
              value: 38
              sustained_days: 1
    sort_order: 7
    checklist:
      - label: "Check row cover condition"
      - label: "Install hoops or frames"
      - label: "Secure cover edges"

  - ref: season-cleanup
    name: "Fall garden cleanup"
    group: "Maintenance"
    trigger:
      type: calendar
      date: "{frost_date_fall}"
      prep_days: -30
    sort_order: 8
    checklist:
      - label: "Remove spent plants"
      - label: "Compost healthy material"
      - label: "Plant cover crop or mulch heavily"
      - label: "Clean and store tools"
