[project]
name = "plansync"
version = "0.2.0"
description = "Condition-aware task orchestrator for life domains"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "mcp>=1.0.0,<2",
    "starlette>=0.27",
    "uvicorn>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dispatch = "dispatch.cli:main"
plan-state = "planstate.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispatch*", "planstate*", "plansync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "mcp-server", "sync"]
