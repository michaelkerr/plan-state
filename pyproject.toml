[project]
name = "plansync"
version = "0.1.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plansync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "mcp-server", "sync"]
