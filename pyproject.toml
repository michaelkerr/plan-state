[project]
name = "plan-state"
version = "0.3.0"
description = "Condition-aware task orchestrator for life domains"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "mcp>=1.0.0,<2",
    "starlette>=0.27",
    "uvicorn>=0.22",
]

[project.urls]
Homepage = "https://github.com/michaelkerr/plan-state"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dispatch = "dispatch.cli:main"
plan-state = "planstate.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispatch*", "planstate*"]

[tool.setuptools.package-data]
dispatch = ["builtin_paths/*/path.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
