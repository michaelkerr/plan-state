# docker-compose.plansync.yaml
#
# Parallel-run service. Merge onto the Reach compose file:
#   docker compose -f docker-compose.yml -f /path/to/plan-state/docker-compose.plansync.yaml up -d plansync-new
#
# Does not replace the existing `plansync` service. That container keeps
# host port 8082. This one publishes 127.0.0.1:8083 and is reachable on the
# Docker network as http://plansync-new:8082.
#
# Required env vars in the Reach .env:
#   OPENWEATHERMAP_API_KEY=<your OpenWeatherMap API key>
#   DISPATCH_LOCATION=Murfreesboro,TN,US
#
# The image has no curl. The healthcheck uses the Python stdlib, matching
# Dockerfile.dispatch.

services:
  plansync-new:
    image: plansync-dispatch:latest
    container_name: reach-plansync-new
    restart: unless-stopped
    environment:
      - OWM_API_KEY=${OPENWEATHERMAP_API_KEY}
      - DISPATCH_LOCATION=${DISPATCH_LOCATION:-Murfreesboro,TN,US}
      - DISPATCH_DB=/data/dispatch.db
      - DISPATCH_CLIENT=hermes
      - TZ=${TZ:-America/Chicago}
    volumes:
      - plansync-new-data:/data
    ports:
      - "127.0.0.1:8083:8082"
    networks:
      - infra
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  plansync-new-data:

networks:
  infra:
    external: true
